services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000/api
        VITE_WS_BASE: ws://localhost:8000/ws
    ports:
      - "5173:80"
    depends_on:
      - backend