name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
        env:
          SECRET_KEY: ci-placeholder-key-needs-to-be-at-least-32-characters-long
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          DATABASE_SSL_REQUIRED: "False"
          REDIS_URL: redis://localhost:6379
          DEBUG: "False"
      - name: Run tests
        run: pytest
        env:
          SECRET_KEY: ci-placeholder-key-needs-to-be-at-least-32-characters-long
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          DATABASE_SSL_REQUIRED: "False"
          REDIS_URL: redis://localhost:6379
          DEBUG: "True"
      - name: Check for known vulnerabilities (Python)
        run: pip install pip-audit && pip-audit -r requirements.txt

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm run test
      - name: Type check and build
        run: npm run build
        env:
          VITE_API_BASE: https://placeholder.example.com/api
          VITE_WS_BASE: wss://placeholder.example.com/ws
      - name: Check for known vulnerabilities (npm)
        run: npm audit --audit-level=high

  deploy:
    needs: [backend-check, frontend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
      - name: Install Vercel CLI
        run: npm install -g vercel
      - name: Deploy to Vercel
        run: vercel deploy --prod --token="${{ secrets.VERCEL_TOKEN }}" --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
